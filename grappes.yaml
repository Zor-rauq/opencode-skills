# =============================================================================
# SOURCE DE VERITE UNIQUE du parc de VM IAAS seanergy.
#
# Ce fichier est lu par :
#   - OpenTofu           (tofu/locals.tf)  -> ce qui est deploye
#   - tools/grappes.mjs                    -> generation de la pipeline + doc
#
# Toute modification passe par une MR. La pipeline redeploie et regenere la doc.
# Rien d'autre ne doit etre edite a la main : la doc d'etat est un artefact.
# =============================================================================

reseau:
  prefixe: "10.29" # plan d'adressage : <prefixe>.<subnet>.<numero*10 + suffixe>

  # X du schema 10.29.X.YZ. A REMPLACER par vos vraies valeurs.
  subnets:
    main: 1
    demo: 2
    st: 3
    to_remove: 4

# Z du schema. L'ordre et les suffixes sont contractuels : ne pas reordonner.
roles:
  - id: apps
    suffixe: 0
    description: Services silo
  - id: mock
    suffixe: 1
    description: Simulateur
  - id: regievideo
    suffixe: 2
    description: Gestion des flux video
  - id: ntp
    suffixe: 3
    description: Serveur de temps

# Gabarits = flavors IaaS. Le nom technique est celui du catalogue de l'IaaS.
gabarits:
  leger:
    flavor: m1.small
    vcpu: 1
    ram_go: 2
    disque_go: 20
  standard:
    flavor: m1.large
    vcpu: 4
    ram_go: 8
    disque_go: 100
  video:
    flavor: m1.xlarge
    vcpu: 8
    ram_go: 16
    disque_go: 500

defauts:
  image: debian-12-generic
  gabarits:
    apps: standard
    mock: leger
    regievideo: video
    ntp: leger

# -----------------------------------------------------------------------------
# Les grappes. Un state OpenTofu par grappe (rayon d'explosion limite).
# `numero` doit rester entre 1 et 25 (numero*10 + 3 <= 254).
# -----------------------------------------------------------------------------
grappes:
  - numero: 1
    env: prod
    subnet: main
    version_composant: "2.4.1"
    validation_manuelle: true # bloque le apply derriere un bouton

  - numero: 8
    env: preprod
    subnet: main
    version_composant: "2.5.0-rc3"
    validation_manuelle: true

  - numero: 9
    env: dev
    subnet: main
    version_composant: "main"
    validation_manuelle: false
    # surcharge possible role par role :
    gabarits:
      regievideo: standard
